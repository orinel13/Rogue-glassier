<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rogue Glassier</title>
  </head>
  <body>
    <div class="app">
      <aside class="hud" aria-label="Game status">
        <div class="brand">Rogue Glassier</div>
        <div class="stat"><span>Level</span><strong id="levelIndex">1 / 5</strong></div>
        <div class="stat"><span>Level name</span><strong id="levelName">Glass Spiral</strong></div>
        <div class="stat"><span>Track type</span><strong id="trackType">spiral</strong></div>
        <div class="stat"><span>Launches level</span><strong id="launches">0</strong></div>
        <div class="stat"><span>Total launches</span><strong id="totalLaunches">0</strong></div>
        <div class="stat"><span>Active balls</span><strong id="activeBalls">0</strong></div>
        <div class="stat"><span>Shards</span><strong id="shards">0</strong></div>
        <div class="stat"><span>Power 1</span><strong id="powerUpgrade">0 / 10</strong></div>
        <div class="stat"><span>Speed 2</span><strong id="speedUpgrade">0 / 8</strong></div>
        <div class="stat"><span>Start Balls 3</span><strong id="ballsUpgrade">0 / 25</strong></div>
        <div class="stat"><span>Broken glass</span><strong id="brokenGlass">0 / 0</strong></div>
        <div class="stat"><span>Core HP</span><strong id="coreHp">0 / 0</strong></div>
        <div class="stat"><span>Best distance</span><strong id="coreDistance">0%</strong></div>
        <div class="stat"><span>Audio</span><strong id="audioStatus">on</strong></div>
        <div class="hint">SPACE launch / next<br />1 power  2 speed  3 balls<br />M mute</div>
      </aside>

      <main class="stage-wrap">
        <canvas id="gameCanvas" width="920" height="920" aria-label="Rogue Glassier game canvas"></canvas>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
